<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UTOPIA · 프로필</title>
  <meta name="theme-color" content="#0E0E0E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="is-loading">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="column">
      <section class="profile" id="profile">
        <button class="icon-btn mobile-only profile-logout" id="mLogout" type="button" aria-label="로그아웃" hidden><span data-icon="logout"></span></button>
        <div class="profile-top">
          <div class="avatar-wrap">
            <img class="avatar xl" id="pAvatar" alt="프로필 사진">
            <label class="avatar-edit" id="avatarEdit" hidden>
              <span data-icon="camera"></span>
              <span class="sr-only">프로필 사진 변경</span>
              <input type="file" id="avatarInput" accept="image/*" hidden>
            </label>
            <span class="avatar-loading" id="avatarLoading" hidden></span>
          </div>
          <div class="peace-chip" id="peaceChip" hidden>
            <span data-icon="peace"></span><b id="peaceVal">0</b><small>PEACE</small>
          </div>
        </div>

        <div class="profile-meta">
          <h2 id="pName">&nbsp;</h2>
          <p class="handle" id="pHandle">&nbsp;</p>
          <p class="readonly-note" id="readonlyNote" hidden></p>
        </div>
      </section>

      <section class="entry-section">
        <div class="section-head">
          <h3><span data-icon="pokeball"></span> 엔트리</h3>
          <span class="entry-count" id="entryCount">0 / 6</span>
        </div>
        <div class="entry-grid" id="entryGrid"></div>
      </section>
    </main>
  </div>

  <nav class="bottomnav" id="bottomnav" aria-label="메인 메뉴"></nav>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
